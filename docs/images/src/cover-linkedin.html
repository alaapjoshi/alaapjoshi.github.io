<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1200px; height: 627px; position: relative; }
  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .eyebrow { font-size: 20px; font-weight: 600; color: var(--accent); }
  h1 { font-size: 72px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: -14px; }
  .pitch { font-size: 26px; line-height: 1.35; color: var(--muted); }
  .right { position: absolute; left: 600px; top: 64px; width: 560px; display: flex; gap: 24px; align-items: flex-start; }
  .right .phone { width: 250px; }
  .right .phone:last-child { margin-top: 56px; }
  .byline { left: 64px; bottom: 40px; }
  .chip { font-size: 18px; padding: 7px 14px; }
</style></head>
<body>
  <div class="left">
    <p class="eyebrow">alaapjoshi.github.io</p>
    <h1>Portfolio</h1>
    <p class="pitch">Experience, projects, and hackathon wins on one fast page.</p>
    <div class="chips"><span class="chip">HTML</span><span class="chip">CSS</span><span class="chip">JavaScript</span><span class="chip">GitHub Pages</span></div>
  </div>
  <div class="right">
    <div class="phone"><img src="shots/mobile-hero.png" alt=""></div>
    <div class="phone"><img src="shots/mobile-projects.png" alt=""></div>
  </div>
  <p class="byline">Alaap Joshi</p>
</body></html>
